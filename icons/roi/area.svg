<?xml version="1.0" encoding="UTF-8" standalone="no"?>

<svg
        width="64"
        height="64"
        viewBox="0 0 64 64"
        version="1.1"
        id="roi-ellipse"
        xmlns="http://www.w3.org/2000/svg">
    <pattern
            id="diagonalHatch"
            patternUnits="userSpaceOnUse"
            width="20"
            height="20">
        <rect fill="#000" opacity=".3" stroke="none" x="0" y="0" width="20" height="20" />
    </pattern>
    <g>
        <ellipse
                fill="url(#diagonalHatch)"
                stroke="#000"
                stroke-width="5"
                cx="32"
                cy="32"
                rx="26"
                ry="26"
        />
    </g>
</svg>